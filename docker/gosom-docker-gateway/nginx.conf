# Allowlist gateway in front of docker-socket-proxy.
#
# Why this exists: docker-socket-proxy's own granularity is per RESOURCE
# FAMILY + HTTP VERB (e.g. "CONTAINERS=1, POST=1"), not per endpoint —
# enabling it for "restart" also enables stop/kill/start/pause/create on
# every container the proxy can see, since those are POST /containers/...
# verbs too. That is broader than this feature needs: gosom-supervisor only
# ever (a) lists containers by label to check gosom's container currently
# exists (a read-only health check), and (b) restarts that one container.
#
# This gateway is the actual enforcement point: it is the ONLY thing with
# network access to docker-socket-proxy (see the docker-compose network
# split), and it forwards exactly two request shapes — rejecting every
# other path and every other method outright, before docker-socket-proxy
# (or the real Docker Engine behind it) ever sees the request:
#   - GET  /containers/json                                  (read-only)
#   - POST /containers/<GOSOM_CONTAINER_NAME>/restart         (below)
#
# The restart path is a LITERAL, hardcoded match on the one Compose
# container name this stack is pinned to (docker-compose.gosom-census.yml
# fixes `name: multimind-gosom-census`, and Compose's own deterministic
# "{project}-{service}-{index}" naming makes this container's name a known
# constant) — never a caller-supplied id. This means the supervisor's own
# discovery/lookup result is NEVER trusted to pick what gets restarted:
# even a fully compromised gosom-supervisor container can only ever hit
# this one exact path. Any other container id/name — including one from a
# different Compose project, or a wrong id from a buggy/compromised
# caller — gets a flat 403 here, before it ever reaches docker-socket-proxy.
#
# If this stack's project name ever changes, update GOSOM_CONTAINER_NAME
# below AND docker-compose.gosom-census.yml's `name:` together.

events {}

http {
    resolver 127.0.0.11 valid=30s;  # Docker's embedded DNS, for the upstream name

    server {
        listen 8080;

        # Discovery: find the gosom container by its Compose service label.
        # Read-only — cannot start, stop, or otherwise mutate anything.
        location = /containers/json {
            limit_except GET {
                deny all;
            }
            set $upstream http://docker-socket-proxy:2375;
            proxy_pass $upstream$request_uri;
        }

        # The one mutating action this feature needs — a LITERAL path match
        # on the single known container name, not a regex that would
        # accept any id/name a caller supplied.
        location = /containers/multimind-gosom-census-gosom-1/restart {
            limit_except POST {
                deny all;
            }
            set $upstream http://docker-socket-proxy:2375;
            proxy_pass $upstream$request_uri;
        }

        # Default-deny: anything not explicitly allowed above — stop, kill,
        # start, pause, create, remove, exec, images, volumes, networks,
        # secrets, swarm, build, etc. — never reaches docker-socket-proxy.
        location / {
            return 403;
        }
    }
}
