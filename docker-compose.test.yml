# Reproducible backend test runner.
# Uses the production image build, mounts local backend source (including tests),
# and installs the repository's declared [dev] extras (pytest + pytest-asyncio).
# Does not change the production api/scraping-worker runtime dependency set.
#
# Example:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm api-test \
#     pytest -q tests/test_blueprint_execution_plan_compiler.py

services:
  api-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
      - api_test_uv_cache:/root/.cache/uv
    environment:
      ENVIRONMENT: development
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://multiai:multiai@postgres:5432/multiai
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      POSTGRES_TEST_ADMIN_URL: postgresql://multiai:multiai@postgres:5432/multiai
      PYTHONPYCACHEPREFIX: ${PYTHONPYCACHEPREFIX:-/tmp/mm-step1-execution-plan}
      SOURCE_DISCOVERY_PROVIDER: serper
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      FACILITY_EXTRACTION_ENABLED: "false"
      FACILITY_PUBLICATION_ENABLED: "false"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        sed -i 's/\r$//' /app/scripts/docker-test-entrypoint.sh
        chmod +x /app/scripts/docker-test-entrypoint.sh
        exec /bin/sh /app/scripts/docker-test-entrypoint.sh "$@"
      - "--"
    command: ["pytest", "-q"]
    # Tests do not serve HTTP; disable the production healthcheck.
    healthcheck:
      disable: true

volumes:
  api_test_uv_cache:
