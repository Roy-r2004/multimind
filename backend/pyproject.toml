[project]
name = "multiai-backend"
version = "1.0.0"
description = "Enterprise Python backend for MultiAI — multi-model orchestration with Jinja prompts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "jinja2>=3.1.4",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "structlog>=24.4.0",
    "python-multipart>=0.0.17",
    "email-validator>=2.2.0",
    "faster-whisper==1.2.1",
    # PyAV 19 removed metadata_errors, which faster-whisper 1.2.1 passes to av.open.
    "av==18.1.0",
    "tenacity>=9.0.0",
    "orjson>=3.10.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.2",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "pillow>=10.4.0",
    # Polygon/multipolygon geometry for Maps Census geographic boundaries
    # (point-in-polygon validation, bounding-box computation, antimeridian
    # handling) — BSD-3-Clause, pure-geometry (bundles GEOS, no GDAL/fiona
    # stack). No suitable geometry library already existed in this project.
    "shapely>=2.0.6",
    # Standard ISO 3166-1/3166-2 country and subdivision tables (LGPL-2.1) —
    # worldwide country-code and state/province name/code resolution without
    # a hand-maintained per-country list.
    "pycountry>=24.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
