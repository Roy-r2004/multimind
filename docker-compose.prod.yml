# Production stack for Coolify / Hostinger VPS
# Coolify → New Resource → Docker Compose → this file

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multiai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-multiai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multiai} -d ${POSTGRES_DB:-multiai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-multiai}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-multiai}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-now}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://multiverdict.tech,http://187.127.230.233:3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://multiverdict.tech}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_SITE_URL: ${PUBLIC_APP_URL:-https://multiverdict.tech}
      OPENROUTER_APP_NAME: MultiAI

      SOURCE_DISCOVERY_PROVIDER: ${SOURCE_DISCOVERY_PROVIDER:-serper}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      SERPER_SEARCH_BASE_URL: ${SERPER_SEARCH_BASE_URL:-https://google.serper.dev/search}
      SERPER_SEARCH_TIMEOUT_SECONDS: ${SERPER_SEARCH_TIMEOUT_SECONDS:-10}
      SERPER_SEARCH_RESULTS_PER_QUERY: ${SERPER_SEARCH_RESULTS_PER_QUERY:-10}
      SERPER_SEARCH_MAX_QUERIES_PER_DISCOVERY: ${SERPER_SEARCH_MAX_QUERIES_PER_DISCOVERY:-4}

      SOURCE_RETRIEVAL_USER_AGENT: ${SOURCE_RETRIEVAL_USER_AGENT:-MultiMindSourceRetrieval/1.0}
      SOURCE_RETRIEVAL_CONNECT_TIMEOUT_SECONDS: ${SOURCE_RETRIEVAL_CONNECT_TIMEOUT_SECONDS:-5}
      SOURCE_RETRIEVAL_TIMEOUT_SECONDS: ${SOURCE_RETRIEVAL_TIMEOUT_SECONDS:-15}
      SOURCE_RETRIEVAL_MAX_REDIRECTS: ${SOURCE_RETRIEVAL_MAX_REDIRECTS:-5}
      SOURCE_RETRIEVAL_MAX_BYTES: ${SOURCE_RETRIEVAL_MAX_BYTES:-2097152}
      SOURCE_RETRIEVAL_ALLOWED_PORTS: ${SOURCE_RETRIEVAL_ALLOWED_PORTS:-80,443}
      SOURCE_RETRIEVAL_ROBOTS_POLICY: ${SOURCE_RETRIEVAL_ROBOTS_POLICY:-respect}
      SOURCE_RETRIEVAL_MAX_CANDIDATES_PER_COVERAGE_CELL: ${SOURCE_RETRIEVAL_MAX_CANDIDATES_PER_COVERAGE_CELL:-10}
      SOURCE_RETRIEVAL_MAX_CANDIDATES_PER_EXECUTION: ${SOURCE_RETRIEVAL_MAX_CANDIDATES_PER_EXECUTION:-150}

      FACILITY_EXTRACTION_ENABLED: ${FACILITY_EXTRACTION_ENABLED:-true}
      FACILITY_EXTRACTION_MODEL: ${FACILITY_EXTRACTION_MODEL:-gpt-4.1}
      FACILITY_EXTRACTION_MAX_DOCUMENTS_PER_EXECUTION: ${FACILITY_EXTRACTION_MAX_DOCUMENTS_PER_EXECUTION:-50}
      FACILITY_EXTRACTION_MAX_CHUNKS_PER_EXECUTION: ${FACILITY_EXTRACTION_MAX_CHUNKS_PER_EXECUTION:-120}
      FACILITY_PUBLICATION_ENABLED: ${FACILITY_PUBLICATION_ENABLED:-true}
      FACILITY_PUBLICATION_MIN_CONFIDENCE: ${FACILITY_PUBLICATION_MIN_CONFIDENCE:-0.55}
      FACILITY_PUBLICATION_MAX_CANDIDATES_PER_EXECUTION: ${FACILITY_PUBLICATION_MAX_CANDIDATES_PER_EXECUTION:-300}
      SCRAPING_INLINE_EXECUTION: ${SCRAPING_INLINE_EXECUTION:-false}
      SEED_AUSTRIA_CENSUS_DEMO: ${SEED_AUSTRIA_CENSUS_DEMO:-true}

      GOOGLE_PLACES_ENABLED: ${GOOGLE_PLACES_ENABLED:-true}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      # Default discovery source for runs that don't choose one; each run
      # can pick google_places or gosom (the self-hosted scraper below).
      MAPS_DISCOVERY_PROVIDER: ${MAPS_DISCOVERY_PROVIDER:-google_places}
      MAPS_GOSOM_SUPERVISOR_TOKEN: ${MAPS_GOSOM_SUPERVISOR_TOKEN:-}
      GOSOM_BASE_URL: ${GOSOM_BASE_URL:-http://gosom:8080}
      GOSOM_TIMEOUT_SECONDS: ${GOSOM_TIMEOUT_SECONDS:-60}
      GOSOM_POLL_INTERVAL_SECONDS: ${GOSOM_POLL_INTERVAL_SECONDS:-5}
      GOSOM_JOB_MAX_TIME_SECONDS: ${GOSOM_JOB_MAX_TIME_SECONDS:-480}
      GOSOM_DEPTH: ${GOSOM_DEPTH:-0}
      GOSOM_LANGUAGE: ${GOSOM_LANGUAGE:-en}
      MAPS_CENSUS_ADMIN_UI_ENABLED: ${MAPS_CENSUS_ADMIN_UI_ENABLED:-true}
      MAPS_CENSUS_EXTERNAL_DISCOVERY_ENABLED: ${MAPS_CENSUS_EXTERNAL_DISCOVERY_ENABLED:-false}
      MAPS_CENSUS_WEBSITE_CRAWL_ENABLED: ${MAPS_CENSUS_WEBSITE_CRAWL_ENABLED:-true}
      MAPS_CENSUS_WEBSITE_SEARCH_ENABLED: ${MAPS_CENSUS_WEBSITE_SEARCH_ENABLED:-true}
      MAPS_CENSUS_ENRICHMENT_ENABLED: ${MAPS_CENSUS_ENRICHMENT_ENABLED:-true}
      MAPS_CENSUS_AUTO_ENRICHMENT_ENABLED: ${MAPS_CENSUS_AUTO_ENRICHMENT_ENABLED:-true}
      MAPS_CENSUS_MAX_CELLS_PER_CAMPAIGN: ${MAPS_CENSUS_MAX_CELLS_PER_CAMPAIGN:-1500}
      MAPS_CENSUS_MAX_PAGES_PER_CELL: ${MAPS_CENSUS_MAX_PAGES_PER_CELL:-3}

      TRANSCRIPTION_ENABLED: ${TRANSCRIPTION_ENABLED:-true}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-large-v3-turbo}
      TRANSCRIPTION_DEVICE: ${TRANSCRIPTION_DEVICE:-cpu}
      TRANSCRIPTION_COMPUTE_TYPE: ${TRANSCRIPTION_COMPUTE_TYPE:-float16}
      TRANSCRIPTION_CPU_MODEL: ${TRANSCRIPTION_CPU_MODEL:-medium}
      TRANSCRIPTION_CPU_COMPUTE_TYPE: ${TRANSCRIPTION_CPU_COMPUTE_TYPE:-int8}
      TRANSCRIPTION_STRICT_DEVICE: ${TRANSCRIPTION_STRICT_DEVICE:-false}
      TRANSCRIPTION_MAX_DURATION_SECONDS: ${TRANSCRIPTION_MAX_DURATION_SECONDS:-600}
      TRANSCRIPTION_MAX_UPLOAD_BYTES: ${TRANSCRIPTION_MAX_UPLOAD_BYTES:-26214400}
      TRANSCRIPTION_TIMEOUT_SECONDS: ${TRANSCRIPTION_TIMEOUT_SECONDS:-300}
      TRANSCRIPTION_TMP_DIR: ${TRANSCRIPTION_TMP_DIR:-/tmp/multimind-transcriptions}
      TRANSCRIPTION_CONCURRENCY: ${TRANSCRIPTION_CONCURRENCY:-1}
      TRANSCRIPTION_MODEL_CACHE_DIR: ${TRANSCRIPTION_MODEL_CACHE_DIR:-/models/whisper}
      HF_HOME: ${HF_HOME:-/models/whisper}
      TRANSCRIPTION_BEAM_SIZE: ${TRANSCRIPTION_BEAM_SIZE:-1}
      TRANSCRIPTION_VAD_FILTER: ${TRANSCRIPTION_VAD_FILTER:-true}
      TRANSCRIPTION_INITIAL_PROMPT: ${TRANSCRIPTION_INITIAL_PROMPT:-MultiMind, OpenRouter, Ollama, Claude, Gemini, GPT, RAG, orchestrator, scraper, blueprint, verdict, model set}

      CHAT_ATTACHMENT_DIR: ${CHAT_ATTACHMENT_DIR:-/app/data/chat_attachments}
      CHAT_ATTACHMENT_MAX_BYTES: ${CHAT_ATTACHMENT_MAX_BYTES:-10485760}
      LIBRARY_FILE_DIR: ${LIBRARY_FILE_DIR:-/app/data/library_files}
      LARGE_DOCUMENTS_ENABLED: ${LARGE_DOCUMENTS_ENABLED:-false}
      DOCUMENT_OCR_MODEL: ${DOCUMENT_OCR_MODEL:-google/gemini-3-flash-preview}
    volumes:
      - whisper_models:/models/whisper
      - chat_attachments:/app/data/chat_attachments
      - library_files:/app/data/library_files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  scraping-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "app.scraping.worker.WorkerSettings"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-multiai}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-multiai}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-now}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_SITE_URL: ${PUBLIC_APP_URL:-https://multiverdict.tech}
      OPENROUTER_APP_NAME: MultiAI

      GOOGLE_PLACES_ENABLED: ${GOOGLE_PLACES_ENABLED:-true}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      # Default discovery source for runs that don't choose one; each run
      # can pick google_places or gosom (the self-hosted scraper below).
      MAPS_DISCOVERY_PROVIDER: ${MAPS_DISCOVERY_PROVIDER:-google_places}
      GOSOM_BASE_URL: ${GOSOM_BASE_URL:-http://gosom:8080}
      GOSOM_TIMEOUT_SECONDS: ${GOSOM_TIMEOUT_SECONDS:-60}
      GOSOM_POLL_INTERVAL_SECONDS: ${GOSOM_POLL_INTERVAL_SECONDS:-5}
      GOSOM_JOB_MAX_TIME_SECONDS: ${GOSOM_JOB_MAX_TIME_SECONDS:-480}
      GOSOM_DEPTH: ${GOSOM_DEPTH:-0}
      GOSOM_LANGUAGE: ${GOSOM_LANGUAGE:-en}
      MAPS_CENSUS_EXTERNAL_DISCOVERY_ENABLED: ${MAPS_CENSUS_EXTERNAL_DISCOVERY_ENABLED:-false}
      MAPS_CENSUS_WEBSITE_CRAWL_ENABLED: ${MAPS_CENSUS_WEBSITE_CRAWL_ENABLED:-true}
      MAPS_CENSUS_WEBSITE_SEARCH_ENABLED: ${MAPS_CENSUS_WEBSITE_SEARCH_ENABLED:-true}
      MAPS_CENSUS_ENRICHMENT_ENABLED: ${MAPS_CENSUS_ENRICHMENT_ENABLED:-true}
      MAPS_CENSUS_AUTO_ENRICHMENT_ENABLED: ${MAPS_CENSUS_AUTO_ENRICHMENT_ENABLED:-true}
      MAPS_CENSUS_MAX_CELLS_PER_CAMPAIGN: ${MAPS_CENSUS_MAX_CELLS_PER_CAMPAIGN:-1500}
      MAPS_CENSUS_MAX_PAGES_PER_CELL: ${MAPS_CENSUS_MAX_PAGES_PER_CELL:-3}

      SOURCE_DISCOVERY_PROVIDER: ${SOURCE_DISCOVERY_PROVIDER:-serper}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      SERPER_SEARCH_BASE_URL: ${SERPER_SEARCH_BASE_URL:-https://google.serper.dev/search}
      SERPER_SEARCH_TIMEOUT_SECONDS: ${SERPER_SEARCH_TIMEOUT_SECONDS:-10}
      SERPER_SEARCH_RESULTS_PER_QUERY: ${SERPER_SEARCH_RESULTS_PER_QUERY:-10}
      SERPER_SEARCH_MAX_QUERIES_PER_DISCOVERY: ${SERPER_SEARCH_MAX_QUERIES_PER_DISCOVERY:-4}

      SOURCE_RETRIEVAL_USER_AGENT: ${SOURCE_RETRIEVAL_USER_AGENT:-MultiMindSourceRetrieval/1.0}
      SOURCE_RETRIEVAL_CONNECT_TIMEOUT_SECONDS: ${SOURCE_RETRIEVAL_CONNECT_TIMEOUT_SECONDS:-5}
      SOURCE_RETRIEVAL_TIMEOUT_SECONDS: ${SOURCE_RETRIEVAL_TIMEOUT_SECONDS:-15}
      SOURCE_RETRIEVAL_MAX_REDIRECTS: ${SOURCE_RETRIEVAL_MAX_REDIRECTS:-5}
      SOURCE_RETRIEVAL_MAX_BYTES: ${SOURCE_RETRIEVAL_MAX_BYTES:-2097152}
      SOURCE_RETRIEVAL_ALLOWED_PORTS: ${SOURCE_RETRIEVAL_ALLOWED_PORTS:-80,443}
      SOURCE_RETRIEVAL_ROBOTS_POLICY: ${SOURCE_RETRIEVAL_ROBOTS_POLICY:-respect}
      SOURCE_RETRIEVAL_MAX_CANDIDATES_PER_COVERAGE_CELL: ${SOURCE_RETRIEVAL_MAX_CANDIDATES_PER_COVERAGE_CELL:-10}
      SOURCE_RETRIEVAL_MAX_CANDIDATES_PER_EXECUTION: ${SOURCE_RETRIEVAL_MAX_CANDIDATES_PER_EXECUTION:-150}

      FACILITY_EXTRACTION_ENABLED: ${FACILITY_EXTRACTION_ENABLED:-true}
      FACILITY_EXTRACTION_MODEL: ${FACILITY_EXTRACTION_MODEL:-gpt-4.1}
      FACILITY_EXTRACTION_MAX_DOCUMENTS_PER_EXECUTION: ${FACILITY_EXTRACTION_MAX_DOCUMENTS_PER_EXECUTION:-50}
      FACILITY_EXTRACTION_MAX_CHUNKS_PER_EXECUTION: ${FACILITY_EXTRACTION_MAX_CHUNKS_PER_EXECUTION:-120}
      FACILITY_PUBLICATION_ENABLED: ${FACILITY_PUBLICATION_ENABLED:-true}
      FACILITY_PUBLICATION_MIN_CONFIDENCE: ${FACILITY_PUBLICATION_MIN_CONFIDENCE:-0.55}
      FACILITY_PUBLICATION_MAX_CANDIDATES_PER_EXECUTION: ${FACILITY_PUBLICATION_MAX_CANDIDATES_PER_EXECUTION:-300}

      SCRAPING_WORKER_CONCURRENCY: ${SCRAPING_WORKER_CONCURRENCY:-9}
      SCRAPING_WORKER_JOB_TIMEOUT_SECONDS: ${SCRAPING_WORKER_JOB_TIMEOUT_SECONDS:-39600}
      SEED_AUSTRIA_CENSUS_DEMO: ${SEED_AUSTRIA_CENSUS_DEMO:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  playbook-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "app.playbooks.worker.WorkerSettings"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-multiai}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-multiai}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-now}
      PLAYBOOK_WORKER_QUEUE_NAME: ${PLAYBOOK_WORKER_QUEUE_NAME:-playbooks}
      PLAYBOOK_WORKER_CONCURRENCY: ${PLAYBOOK_WORKER_CONCURRENCY:-1}
      PLAYBOOK_WORKER_JOB_TIMEOUT_SECONDS: ${PLAYBOOK_WORKER_JOB_TIMEOUT_SECONDS:-3600}
      PLAYBOOK_WORKER_KEEP_RESULT_SECONDS: ${PLAYBOOK_WORKER_KEEP_RESULT_SECONDS:-3600}

      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_SITE_URL: ${PUBLIC_APP_URL:-https://multiverdict.tech}
      OPENROUTER_APP_NAME: MultiAI
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://multiverdict.tech}
      PLAYBOOK_EXTRACTION_MODEL_ID: ${PLAYBOOK_EXTRACTION_MODEL_ID:-gpt-4.1}
      PLAYBOOK_CORE_SUMMARY_MAX_CHARS: ${PLAYBOOK_CORE_SUMMARY_MAX_CHARS:-4000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "app.playbooks.worker.WorkerSettings", "--check"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  document-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "app.documents.worker.WorkerSettings"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-multiai}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-multiai}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me}
      LARGE_DOCUMENTS_ENABLED: ${LARGE_DOCUMENTS_ENABLED:-false}
      DOCUMENT_OCR_MODEL: ${DOCUMENT_OCR_MODEL:-google/gemini-3-flash-preview}
      CHAT_ATTACHMENT_DIR: ${CHAT_ATTACHMENT_DIR:-/app/data/chat_attachments}
      LIBRARY_FILE_DIR: ${LIBRARY_FILE_DIR:-/app/data/library_files}
      DOCUMENT_WORKER_QUEUE_NAME: ${DOCUMENT_WORKER_QUEUE_NAME:-documents}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_SITE_URL: ${PUBLIC_APP_URL:-https://multiverdict.tech}
      OPENROUTER_APP_NAME: MultiAI
    volumes:
      - chat_attachments:/app/data/chat_attachments
      - library_files:/app/data/library_files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "app.documents.worker.WorkerSettings", "--check"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_MAPS_CENSUS_ADMIN_ENABLED: ${VITE_MAPS_CENSUS_ADMIN_ENABLED:-true}
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: 0.0.0.0
      BACKEND_PROXY_TARGET: http://api:8000
      API_PUBLIC_URL: ${PUBLIC_APP_URL:-https://multiverdict.tech}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Self-hosted Google Maps scraper for Maps census runs that choose the
  # gosom source. Reachable only on this Compose network.
  gosom:
    image: gosom/google-maps-scraper:v1.18.1
    command: ["-web", "-addr", ":8080", "-data-folder", "/gmapsdata", "-c", "1"]
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /opt/browsers
    volumes:
      - gosom_data:/gmapsdata
      - gosom_playwright_cache:/opt
    mem_limit: 2g
    cpus: 2
    expose:
      - "8080"
    restart: unless-stopped

  # --- Automatic recovery when gosom's dispatcher freezes (gosom #328).
  # The supervisor polls the API's /internal/gosom-supervisor/status and
  # restarts gosom only when the server confirms a freeze. Only the gateway
  # holds the Docker socket, and it allows nothing but listing containers and
  # restarting this deployment's gosom (Coolify renames containers on every
  # deploy, so that is a name prefix embedding the Coolify resource id). See
  # docker/gosom-docker-gateway/templates/nginx.conf.template.
  gosom-docker-gateway:
    build:
      context: ./docker/gosom-docker-gateway
      dockerfile: Dockerfile
    environment:
      GOSOM_CONTAINER_NAME_PREFIX: ${GOSOM_SUPERVISOR_CONTAINER_NAME_PREFIX:-gosom-fqhz20ulcg5huwiewn044kks-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8080"
    restart: unless-stopped

  gosom-supervisor:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "scripts.gosom_supervisor"]
    environment:
      MAPS_GOSOM_SUPERVISOR_TOKEN: ${MAPS_GOSOM_SUPERVISOR_TOKEN:-}
      GOSOM_SUPERVISOR_API_BASE_URL: http://api:8000
      GOSOM_SUPERVISOR_DOCKER_PROXY_URL: http://gosom-docker-gateway:8080
      GOSOM_SUPERVISOR_CONTAINER_NAME_PREFIX: ${GOSOM_SUPERVISOR_CONTAINER_NAME_PREFIX:-gosom-fqhz20ulcg5huwiewn044kks-}
      GOSOM_SUPERVISOR_GOSOM_HEALTH_URL: http://gosom:8080/api/v1/jobs
      GOSOM_SUPERVISOR_POLL_INTERVAL_SECONDS: "60"
    # The backend image's healthcheck probes the API port, which this
    # container never opens.
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
      gosom-docker-gateway:
        condition: service_started
    restart: always

volumes:
  postgres_data:
  whisper_models:
  chat_attachments:
  library_files:
  gosom_data:
  gosom_playwright_cache:
